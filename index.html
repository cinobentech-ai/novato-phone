<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Novato</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: system-ui, sans-serif; background: #0b1530; color: #eef3ff; margin: 0; padding: 20px; }
    input, button { width: 100%; box-sizing: border-box; padding: 12px; margin: 6px 0; border-radius: 10px; border: 0; font-size: 16px; }
    button { background: #3dd6c6; font-weight: 700; }
    .card { background: #132044; padding: 16px; border-radius: 16px; margin-bottom: 12px; }
    .muted { color: #9bb0d0; font-size: 14px; }
    .err { color: #ff8a8a; }
    .ok { color: #7dffc0; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <h1>Novato</h1>
  <p class="muted">Use raw.githack.com/cinobentech-ai/novato-phone/main/index.html if this host shows code.</p>
  <div id="msg" class="muted"></div>
  <div class="card" id="box-setup">
    <b>1. Connect project</b>
    <input id="url" value="https://buzmxatbmiqtiysmwcya.supabase.co" />
    <input id="key" placeholder="anon public key (eyJ...)" />
    <button id="btn-save">Save and finish login</button>
  </div>
  <div class="card hidden" id="box-auth">
    <b>2. Email login</b>
    <input id="email" type="email" placeholder="you@email.com" />
    <button id="btn-link">Send login email</button>
    <input id="code" placeholder="123456" inputmode="numeric" />
    <button id="btn-code">Confirm code</button>
    <button id="btn-out" type="button">Sign out</button>
  </div>
  <div class="card hidden" id="box-app">
    <b>3. You are in</b>
    <div id="who"></div>
    <div id="orgs" class="muted"></div>
    <input id="org" placeholder="New organization name" />
    <button id="btn-org">Create organization</button>
  </div>
  <script>
    const $ = (id) => document.getElementById(id);
    const msg = (t, ok) => { const el = $("msg"); el.textContent = t || ""; el.className = ok ? "ok" : "err"; };
    let sb = null;
    const DEFAULT_URL = "https://buzmxatbmiqtiysmwcya.supabase.co";
    function saved() { try { return JSON.parse(localStorage.getItem("novato.phone") || "null"); } catch { return null; } }
    function redirectUrl() { return location.origin + location.pathname; }
    function parseHash() {
      if (!location.hash) return {};
      return Object.fromEntries(new URLSearchParams(location.hash.replace(/^#/, "")));
    }
    function cleanHash() {
      if (location.hash) history.replaceState({}, "", location.pathname + location.search);
    }
    function client() {
      const c = saved();
      if (!c || !c.url || !c.key) return null;
      if (!sb) {
        sb = window.supabase.createClient(c.url, c.key, {
          auth: { detectSessionInUrl: true, persistSession: true, autoRefreshToken: true, flowType: "implicit" }
        });
      }
      return sb;
    }
    async function takeHashSession() {
      const h = parseHash();
      if (h.error || h.error_description) { cleanHash(); throw new Error(h.error_description || h.error); }
      if (!h.access_token || !h.refresh_token) return null;
      const mark = h.access_token.slice(-12);
      if (sessionStorage.getItem("novato.auth.hash") === mark) {
        cleanHash();
        return client() ? (await sb.auth.getSession()).data.session : null;
      }
      if (!client()) return null;
      const { data, error } = await sb.auth.setSession({ access_token: h.access_token, refresh_token: h.refresh_token });
      if (error) { cleanHash(); throw error; }
      sessionStorage.setItem("novato.auth.hash", mark);
      cleanHash();
      return data.session;
    }
    async function refresh() {
      const c = saved();
      $("url").value = (c && c.url) || DEFAULT_URL;
      if (c && c.key) $("key").value = c.key;
      if (!client()) {
        $("box-auth").classList.add("hidden");
        $("box-app").classList.add("hidden");
        if (parseHash().access_token) msg("Paste your anon key, tap Save and finish login.", false);
        return;
      }
      $("box-auth").classList.remove("hidden");
      let session = null;
      try { session = await takeHashSession(); } catch (e) { msg(e.message); }
      if (!session) session = (await sb.auth.getSession()).data.session;
      if (!session) { $("box-app").classList.add("hidden"); return; }
      $("box-app").classList.remove("hidden");
      $("who").textContent = session.user.email;
      const orgs = await sb.from("organization_members").select("role, organizations(name,id)").eq("status", "active");
      $("orgs").textContent = (orgs.data || []).map((r) => (r.organizations && r.organizations.name) + " (" + r.role + ")").join(" · ") || "No organization yet.";
      msg("Logged in.", true);
    }
    $("btn-save").onclick = async () => {
      sb = null;
      localStorage.setItem("novato.phone", JSON.stringify({ url: $("url").value.trim(), key: $("key").value.trim() }));
      msg("Saved.", true);
      await refresh();
    };
    $("btn-link").onclick = async () => {
      try {
        if (!client()) throw new Error("Save URL and anon key first.");
        const { error } = await sb.auth.signInWithOtp({ email: $("email").value.trim(), options: { emailRedirectTo: redirectUrl(), shouldCreateUser: true } });
        if (error) throw error;
        msg("Check your email.", true);
      } catch (e) { msg(e.message); }
    };
    $("btn-code").onclick = async () => {
      try {
        if (!client()) throw new Error("Save the key first.");
        const { error } = await sb.auth.verifyOtp({ email: $("email").value.trim(), token: $("code").value.trim(), type: "email" });
        if (error) throw error;
        await refresh();
      } catch (e) { msg(e.message); }
    };
    $("btn-out").onclick = async () => {
      if (client()) await sb.auth.signOut();
      sessionStorage.removeItem("novato.auth.hash");
      $("box-app").classList.add("hidden");
      msg("Signed out.", true);
    };
    $("btn-org").onclick = async () => {
      try {
        const { data, error } = await sb.rpc("create_organization", { p_name: $("org").value.trim() });
        if (error) throw error;
        msg("Created " + data.name, true);
        await refresh();
      } catch (e) { msg(e.message); }
    };
    refresh();
  </script>
</body>
</html>
