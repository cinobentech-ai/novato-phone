<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Novato</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: system-ui, sans-serif; background: #0b1530; color: #eef3ff; margin: 0; padding: 20px; }
    input, button { width: 100%; box-sizing: border-box; padding: 12px; margin: 6px 0; border-radius: 10px; border: 0; font-size: 16px; }
    button { background: #3dd6c6; font-weight: 700; }
    .card { background: #132044; padding: 16px; border-radius: 16px; margin-bottom: 12px; }
    .muted { color: #9bb0d0; font-size: 14px; }
    .err { color: #ff8a8a; }
    .ok { color: #7dffc0; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <h1>Novato</h1>
  <p class="muted">Use raw.githack.com/cinobentech-ai/novato-phone/main/index.html if this host shows code.</p>
  <div id="msg" class="muted"></div>
  <div class="card" id="box-setup">
    <b>1. Connect project</b>
    <input id="url" value="https://buzmxatbmiqtiysmwcya.supabase.co" />
    <input id="key" placeholder="anon public key (eyJ...)" />
    <button id="btn-save">Save and finish login</button>
  </div>
  <div class="card hidden" id="box-auth">
    <b>2. Email login</b>
    <input id="email" type="email" placeholder="you@email.com" />
    <button id="btn-link">Send login email</button>
    <input id="code" placeholder="123456" inputmode="numeric" />
    <button id="btn-code">Confirm code</button>
    <button id="btn-out" type="button">Sign out</button>
  </div>
  <div class="card hidden" id="box-app">
    <b>3. You are in</b>
    <div id="who"></div>
    <div id="orgs" class="muted"></div>
    <input id="org" placeholder="New organization name" />
    <button id="btn-org">Create organization</button>
  </div>
    <script>
const $ = (id) => document.getElementById(id);

let sb = null;

function msg(text, ok = false) {
  const el = $("msg");
  if (el) {
    el.textContent = text;
    el.style.color = ok ? "green" : "red";
  }
}

function client() {
  const url = $("sb-url").value.trim();
  const key = $("sb-key").value.trim();

  if (!url || !key) return null;

  if (!sb) {
    sb = supabase.createClient(url, key, {
      auth: {
        detectSessionInUrl: true,
        persistSession: true,
        autoRefreshToken: true
      }
    });
  }

  return sb;
}

function cleanAuthUrl() {
  const url = new URL(window.location.href);

  if (
    url.hash.includes("access_token") ||
    url.hash.includes("refresh_token") ||
    url.hash.includes("type=magiclink")
  ) {
    window.history.replaceState(
      {},
      document.title,
      url.origin + url.pathname + url.search
    );
  }
}

async function loadApp(session) {
  if (!session) {
    $("box-app").classList.add("hidden");
    return;
  }

  $("box-app").classList.remove("hidden");

  if ($("who")) {
    $("who").textContent = session.user.email || "";
  }

  const { data, error } = await sb
    .from("organization_members")
    .select("organization_id, role, organizations(name)")
    .eq("user_id", session.user.id);

  if (error) {
    msg(error.message);
    return;
  }

  console.log("Organizations:", data);
}

async function refresh() {
  const c = client();
  if (!c) return;

  const { data, error } = await c.auth.getSession();

  if (error) {
    msg(error.message);
    return;
  }

  if (data.session) {
    cleanAuthUrl();
    await loadApp(data.session);
  }
}

async function initAuth() {
  const c = client();
  if (!c) return;

  c.auth.onAuthStateChange(async (event, session) => {
    console.log("Auth event:", event);

    if (event === "SIGNED_IN" && session) {
      cleanAuthUrl();

      setTimeout(async () => {
        await loadApp(session);
        msg("Logged in successfully.", true);
      }, 0);
    }

    if (event === "SIGNED_OUT") {
      $("box-app").classList.add("hidden");
      msg("Signed out.", true);
    }
  });

  await refresh();
}

$("btn-save").onclick = async () => {
  try {
    const url = $("url").value.trim();
    const key = $("key").value.trim();

    if (!url || !key) {
      throw new Error("Enter your Supabase URL and anon key.");
    }

    localStorage.setItem("novato.sb.url", url);
    localStorage.setItem("novato.sb.key", key);

    sb = null;

    msg("Saved.", true);
    await initAuth();
  } catch (e) {
    msg(e.message);
  }
};

$("btn-link").onclick = async () => {
  try {
    if (!client()) {
      throw new Error("Save your Supabase settings first.");
    }

    const email = $("email").value.trim();

    if (!email) {
      throw new Error("Enter your email.");
    }

    const redirectTo =
      window.location.origin + window.location.pathname;

    const { error } = await sb.auth.signInWithOtp({
      email,
      options: {
        emailRedirectTo: redirectTo,
        shouldCreateUser: true
      }
    });

    if (error) throw error;

    msg("Check your email.", true);
  } catch (e) {
    msg(e.message);
  }
};

$("btn-code").onclick = async () => {
  try {
    if (!client()) {
      throw new Error("Save your Supabase settings first.");
    }

    const email = $("email").value.trim();
    const token = $("code").value.trim();

    const { error } = await sb.auth.verifyOtp({
      email,
      token,
      type: "email"
    });

    if (error) throw error;

    await refresh();
  } catch (e) {
    msg(e.message);
  }
};

$("btn-out").onclick = async () => {
  if (client()) {
    await sb.auth.signOut();
  }

  sessionStorage.removeItem("novato.auth.hint");
  $("box-app").classList.add("hidden");
  msg("Signed out.", true);
};

$("btn-org").onclick = async () => {
  try {
    if (!client()) {
      throw new Error("Save your Supabase settings first.");
    }

    const name = $("org-name").value.trim();

    if (!name) {
      throw new Error("Enter an organization name.");
    }

    const { data, error } = await sb.rpc(
      "create_organization",
      { p_name: name }
    );

    if (error) throw error;

    msg("Created " + (data?.name || name), true);
    await refresh();
  } catch (e) {
    msg(e.message);
  }
};

const savedUrl = localStorage.getItem("novato.sb.url");
const savedKey = localStorage.getItem("novato.sb.key");

if (savedUrl) $("sb-url").value = savedUrl;
if (savedKey) $("sb-key").value = savedKey;

initAuth().catch((e) => msg(e.message));
</script>
</body>
</html>
