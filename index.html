<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Novato</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: system-ui, sans-serif; background: #0b1530; color: #eef3ff; margin: 0; padding: 20px; }
    input, button { width: 100%; box-sizing: border-box; padding: 12px; margin: 6px 0; border-radius: 10px; border: 0; font-size: 16px; }
    button { background: #3dd6c6; font-weight: 700; }
    .card { background: #132044; padding: 16px; border-radius: 16px; margin-bottom: 12px; }
    .muted { color: #9bb0d0; font-size: 14px; }
    .err { color: #ff8a8a; }
    .ok { color: #7dffc0; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <h1>Novato</h1>
  <div id="msg" class="muted"></div>
  <div class="card hidden" id="box-auth">
    <b>Email login</b>
    <input id="email" type="email" placeholder="you@email.com" />
    <button id="btn-link">Send login email</button>
    <p class="muted">Check your email and tap the link — it will bring you back here signed in. Open it in the same browser you're using now (avoid an in-app mail browser if possible).</p>
    <button id="btn-out" type="button">Sign out</button>
  </div>
  <div class="card hidden" id="box-app">
    <b>You are in</b>
    <div id="who"></div>
    <div id="orgs" class="muted"></div>
    <input id="org" placeholder="New organization name" />
    <button id="btn-org">Create organization</button>
  </div>
  <script>
const $ = (id) => document.getElementById(id);

// Public anon key — safe to embed client-side, protected by Row Level Security.
const SUPABASE_URL = "https://buzmxatbmiqtiysmwcya.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ1em14YXRibWlxdGl5c213Y3lhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkyNTEwODcsImV4cCI6MjEwNDgyNzA4N30.f3a_skPqMTF5rHhg33LE8KNhf53kTJ497Kb3n0FjEOc";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: {
    detectSessionInUrl: true,
    persistSession: true,
    autoRefreshToken: true
  }
});

function msg(text, ok = false) {
  const el = $("msg");
  if (el) {
    el.textContent = text;
    el.className = ok ? "ok" : "err";
  }
}

function cleanAuthUrl() {
  const url = new URL(window.location.href);

  if (
    url.hash.includes("access_token") ||
    url.hash.includes("refresh_token") ||
    url.hash.includes("type=magiclink")
  ) {
    window.history.replaceState(
      {},
      document.title,
      url.origin + url.pathname + url.search
    );
  }
}

async function loadApp(session) {
  if (!session) {
    $("box-app").classList.add("hidden");
    return;
  }
  $("box-auth").classList.add("hidden");
  $("box-app").classList.remove("hidden");

  if ($("who")) {
    $("who").textContent = session.user.email || "";
  }

  const { data, error } = await sb
    .from("organization_members")
    .select("organization_id, role, organizations(name)")
    .eq("user_id", session.user.id);

  if (error) {
    msg(error.message);
    return;
  }

  $("orgs").textContent =
    (data || [])
      .map((r) => (r.organizations && r.organizations.name) + " (" + r.role + ")")
      .join(" · ") || "No organization yet.";
}

async function refresh() {
  const { data, error } = await sb.auth.getSession();

  if (error) {
    msg(error.message);
    return;
  }

  if (data.session) {
    cleanAuthUrl();
    await loadApp(data.session);
  } else {
    $("box-auth").classList.remove("hidden");
  }
}

sb.auth.onAuthStateChange(async (event, session) => {
  console.log("Auth event:", event);

  if (event === "SIGNED_IN" && session) {
    cleanAuthUrl();

    setTimeout(async () => {
      await loadApp(session);
      msg("Logged in successfully.", true);
    }, 0);
  }

  if (event === "SIGNED_OUT") {
    $("box-app").classList.add("hidden");
    $("box-auth").classList.remove("hidden");
    msg("Signed out.", true);
  }
});

$("btn-link").onclick = async () => {
  try {
    const email = $("email").value.trim();

    if (!email) {
      throw new Error("Enter your email.");
    }

    const redirectTo = window.location.origin + window.location.pathname;

    const { error } = await sb.auth.signInWithOtp({
      email,
      options: {
        emailRedirectTo: redirectTo,
        shouldCreateUser: true
      }
    });

    if (error) throw error;

    msg("Check your email.", true);
  } catch (e) {
    msg(e.message);
  }
};

$("btn-out").onclick = async () => {
  await sb.auth.signOut();
  $("box-app").classList.add("hidden");
  $("box-auth").classList.remove("hidden");
  msg("Signed out.", true);
};

$("btn-org").onclick = async () => {
  try {
    const name = $("org").value.trim();

    if (!name) {
      throw new Error("Enter an organization name.");
    }

    const { data, error } = await sb.rpc("create_organization", { p_name: name });

    if (error) throw error;

    msg("Created " + (data?.name || name), true);
    await refresh();
  } catch (e) {
    msg(e.message);
  }
};

refresh().catch((e) => msg(e.message));
</script>
</body>
</html>
